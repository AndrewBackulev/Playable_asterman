<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Stay Safe During a Storm</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#08233d;color:#fff}.frame{--items:url('storm-item-icons-v1.png');position:relative;width:min(100vw,56.25dvh);height:min(177.778vw,100dvh);margin:auto;overflow:hidden;background:linear-gradient(#122c54 0 22%,#254a6b 22% 44%,#0d5f78 44% 100%)}.rain{position:absolute;inset:0;opacity:.28;background:repeating-linear-gradient(110deg,transparent 0 26px,#b5edff 27px 29px,transparent 30px 62px);animation:rain .7s linear infinite}.cloud{position:absolute;width:150%;height:26%;left:-25%;background:#142543d9;border-radius:0 0 50% 50%;filter:blur(8px)}.cloud.one{top:-9%}.cloud.two{top:12%;left:-35%;opacity:.75}.chapter{position:absolute;top:4.2%;left:6%;right:6%;z-index:3;display:flex;justify-content:space-between;font-size:clamp(13px,3.5vw,20px);font-weight:900;letter-spacing:.06em;text-shadow:0 2px #132743}.chapter b{font-size:.8em;color:#d8efff}.title{position:absolute;top:10%;left:8%;right:8%;z-index:3;text-align:center;font-size:clamp(31px,8.5vw,50px);line-height:.96;margin:0;text-shadow:0 4px #162c4a}.task{position:absolute;top:22%;left:8%;right:8%;z-index:3;background:#092b47dd;border:2px solid #92d8fa;border-radius:18px;text-align:center;padding:11px 14px;font-size:clamp(17px,4.7vw,28px);font-weight:900;box-shadow:0 5px #061a2c}.meter{height:9px;background:#173f58;border-radius:8px;overflow:hidden;margin-top:9px}.meter i{display:block;width:0;height:100%;background:linear-gradient(90deg,#9de55b,#fff261);transition:width .25s}.hint{position:absolute;top:33%;left:0;right:0;z-index:3;text-align:center;font-size:clamp(15px,4vw,23px);font-weight:bold;text-shadow:0 2px #102a42}.board{position:absolute;top:40%;left:5%;right:5%;bottom:6%;z-index:3;padding:9px;background:#d6efff;border:4px solid #79b3d3;border-radius:18px;box-shadow:0 7px #0d4667;color:#14334d}.board h2{margin:0 0 7px;text-align:center;font-size:clamp(18px,5vw,28px);letter-spacing:.04em}.grid{height:calc(100% - 39px);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:5px}.cell{display:grid;place-items:center;background:#5f96c9;border:2px solid #5189bd;border-radius:8px;box-shadow:inset 0 2px #8fc0ed}.piece{position:relative;width:86%;height:78%;display:grid;place-items:center;cursor:pointer;transition:transform .15s,filter .15s;border:0;background:transparent;padding:0}.rope:before{content:'';width:95%;height:95%;background:var(--items) 0 0/200% 200% no-repeat;filter:drop-shadow(0 3px 1px #294d6a)}.rope b{position:absolute;z-index:2;right:-4%;bottom:-3%;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#103e61;color:#fff;font:bold 13px/21px Arial;border:1px solid #dff5ff}.rope.selected{filter:drop-shadow(0 0 8px #fff248);transform:scale(1.09)}.rope.matched{visibility:hidden;pointer-events:none}.obstacle{filter:drop-shadow(0 3px 1px #294d6a)}.obstacle:before{content:'';width:90%;height:90%;display:block;background:var(--items) 100% 0/200% 200% no-repeat}.obstacle.shell:before{background-position:0 100%}.obstacle.compass:before{background-position:100% 100%}.tip{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:12px;font-weight:bold;color:#35516a}.complete{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;text-align:center;background:#082b48e8}.complete>div{padding:30px}.complete .mark{font-size:80px}.complete h1{font-size:clamp(36px,10vw,57px);margin:5px 0;text-shadow:0 4px #17334e}.complete p{font-size:20px;margin:0}.flash{animation:flash .45s ease-out}@keyframes rain{to{background-position:0 62px}}@keyframes flash{50%{filter:brightness(2.3)}}
    .rain{inset:-32%;transform:rotate(-12deg);background-size:74px 74px;will-change:background-position}.frame{--single-rope:url('single-rope-v1.png')}.task-icon{display:inline-block;width:1.25em;height:1.05em;margin-right:.24em;vertical-align:-.18em;background:var(--single-rope) center/contain no-repeat}.grid{height:auto;aspect-ratio:4/3;grid-template-rows:repeat(3,1fr)}.task-icon,.rope:before{background:var(--single-rope) center/contain no-repeat}.rope.merged:before{background:var(--items) 0 0/200% 200% no-repeat}.piece{touch-action:none}.piece.dragging{position:fixed;z-index:20;width:82px;height:63px;pointer-events:none;filter:brightness(1.13);cursor:grabbing}.hint-cell{border-color:#ffe14f!important;animation:yellowPulse 1s ease-in-out infinite}@keyframes yellowPulse{0%,100%{box-shadow:inset 0 2px #8fc0ed,0 0 0 0 #ffe14f00}50%{box-shadow:inset 0 2px #fff4a1,0 0 16px 5px #ffe14fdd}}
  </style>
</head>
<body>
  <main class="frame" aria-label="Storm safety rope matching puzzle"><div class="rain"></div><div class="cloud one"></div><div class="cloud two"></div>
    <div class="chapter"><span>CHAPTER 1 / 2</span></div>
    <h1 class="title">Stay safe<br>during a storm!</h1>
    <div class="task"><span class="task-icon" aria-hidden="true"></span>Secure the boat<div class="meter"><i id="progress"></i></div></div>
    <p class="hint">Match the ropes together</p>
    <section class="board"><h2 id="heading">MERGE THE ROPES!</h2><div id="grid" class="grid"></div><div class="tip">Tap one rope, then its match</div></section>
    <section id="complete" class="complete"><div><div class="mark">⚓</div><h1>Boat secured!</h1><p>She is ready for the storm.</p></div></section>
  </main>
  <script>
    (function(){var grid=document.getElementById('grid'),selected=null,merged=0,done=false,drag=null;var cells=['rope','sunglasses','empty','shell','compass','rope','empty','sunglasses','shell','empty','rope','rope'],tutorial=0;
      cells.forEach(function(type){var cell=document.createElement('div');cell.className='cell';if(type==='rope'){var item=document.createElement('button');item.className='piece rope';item.type='button';item.dataset.value='1';item.innerHTML='<b>1</b>';item.setAttribute('aria-label','Rope bundle');item.addEventListener('pointerdown',down);if(tutorial<2){cell.classList.add('hint-cell');tutorial++}cell.appendChild(item)}else if(type!=='empty'){var obstacle=document.createElement('div');obstacle.className='piece obstacle '+type;obstacle.setAttribute('aria-label',type);obstacle.addEventListener('pointerdown',down);cell.appendChild(obstacle)}grid.appendChild(cell)});
      function down(e){var piece=e.currentTarget;if(piece.classList.contains('matched'))return;var bounds=piece.getBoundingClientRect();drag={piece:piece,dx:e.clientX-bounds.left,dy:e.clientY-bounds.top,startX:e.clientX,startY:e.clientY,home:piece.parentNode};piece.classList.add('dragging');piece.style.setProperty('--items',getComputedStyle(piece).getPropertyValue('--items'));piece.style.setProperty('--single-rope',getComputedStyle(piece).getPropertyValue('--single-rope'));piece.style.left=(e.clientX-drag.dx)+'px';piece.style.top=(e.clientY-drag.dy)+'px';document.body.appendChild(piece);piece.setPointerCapture(e.pointerId);piece.addEventListener('pointermove',move);piece.addEventListener('pointerup',drop);e.preventDefault()}
      function move(e){if(!drag)return;drag.piece.style.left=(e.clientX-drag.dx)+'px';drag.piece.style.top=(e.clientY-drag.dy)+'px'}
      function drop(e){if(!drag)return;var piece=drag.piece,wasTap=Math.abs(e.clientX-drag.startX)<10&&Math.abs(e.clientY-drag.startY)<10,x=e.clientX,y=e.clientY,target=null,point=document.elementFromPoint(x,y),cell=point&&point.closest('.cell');piece.removeEventListener('pointermove',move);piece.removeEventListener('pointerup',drop);if(!wasTap&&piece.classList.contains('rope')){document.querySelectorAll('.piece.rope:not(.matched)').forEach(function(candidate){if(candidate===piece||target)return;var bounds=candidate.getBoundingClientRect();if(x>=bounds.left&&x<=bounds.right&&y>=bounds.top&&y<=bounds.bottom)target=candidate})}if(!wasTap&&cell&&!cell.querySelector('.piece:not(.matched)')){cell.appendChild(piece);piece.removeAttribute('style');piece.classList.remove('dragging');drag=null;return}drag.home.appendChild(piece);piece.removeAttribute('style');piece.classList.remove('dragging');drag=null;if(wasTap){select({currentTarget:piece});return}if(target&&target.dataset.value===piece.dataset.value)merge(piece,target)}
      function select(e){var rope=e.currentTarget;if(!rope.classList.contains('rope')||done||rope.classList.contains('matched'))return;if(!selected){selected=rope;rope.classList.add('selected');return}var first=selected;selected=null;first.classList.remove('selected');if(first===rope)return;if(first.dataset.value===rope.dataset.value)merge(first,rope)}
      function merge(first,rope){if(first.classList.contains('matched')||rope.classList.contains('matched'))return;first.classList.add('matched');rope.dataset.value=String(Number(rope.dataset.value)+Number(first.dataset.value));rope.classList.add('merged');rope.querySelector('b').textContent=rope.dataset.value;rope.classList.add('flash');merged++;if(merged===1)document.querySelectorAll('.hint-cell').forEach(function(cell){cell.classList.remove('hint-cell')});document.getElementById('progress').style.width=(merged/3*100)+'%';document.getElementById('heading').textContent=rope.dataset.value==='4'?'BOAT READY!':'GREAT MERGE!';if(rope.dataset.value==='4'){done=true;setTimeout(function(){document.getElementById('complete').style.display='flex';if(window.parent!==window)window.parent.postMessage({type:'storm-rope-complete'},'*')},700)}}
    }());
  </script>
</body>
</html>
